http:
  method: GET
  url: "{{baseUrl}}/flights?page=2&per_page=25"
  params:
    - name: page
      value: "2"
      type: query
    - name: per_page
      value: "25"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
