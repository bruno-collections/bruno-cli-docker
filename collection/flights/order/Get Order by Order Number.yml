info:
  name: Get Order by Order Number
  type: http
  seq: 2

app:
  code: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Flight Order Lookup</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            body {
                font-size: 13px;
            }
        </style>
        <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
        <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
        <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    </head>
    <body>
        <div id="root"></div>

        <script type="text/babel">
            const { useState } = React;

            function App() {
                const [orderNumber, setOrderNumber] = useState('');
                const [order, setOrder] = useState(null);
                const [loading, setLoading] = useState(false);
                const [error, setError] = useState(null);

                const handleSearch = async () => {
                    if (!orderNumber.trim()) {
                        setError('Please enter an order number');
                        return;
                    }

                    setLoading(true);
                    setError(null);
                    setOrder(null);

                    try {
                        const response = await ctx.sendRequest({ orderNumber: orderNumber.trim() });
                        
                        if (response.data && response.data.length > 0) {
                            setOrder(response.data[0]);
                        } else {
                            setError('No order found');
                        }
                    } catch (err) {
                        setError(err.message || 'Failed to fetch order');
                    } finally {
                        setLoading(false);
                    }
                };

                const handleKeyPress = (e) => {
                    if (e.key === 'Enter') {
                        handleSearch();
                    }
                };

                return (
                    <div className="min-h-screen p-4">
                        <div className="max-w-3xl mx-auto">
                            {/* Search Section */}
                            <div className="mb-4">
                                <h1 className="text-base font-bold text-gray-900 mb-2">Flight Order Lookup</h1>
                                <div className="flex gap-2">
                                    <input
                                        type="text"
                                        value={orderNumber}
                                        onChange={(e) => setOrderNumber(e.target.value.toUpperCase())}
                                        onKeyPress={handleKeyPress}
                                        placeholder="Enter order number (e.g., 1XGGJFT)"
                                        className="flex-1 px-3 py-1.5 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
                                    />
                                    <button
                                        onClick={handleSearch}
                                        disabled={loading}
                                        className="px-4 py-1.5 bg-blue-600 text-white rounded hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed transition-colors"
                                    >
                                        {loading ? 'Searching...' : 'Search'}
                                    </button>
                                </div>
                                {error && (
                                    <div className="mt-2 text-red-600">{error}</div>
                                )}
                            </div>

                            {/* Order Details */}
                            {order && (
                                <div className="border border-gray-200 rounded">
                                    {/* Header */}
                                    <div className="p-3 border-b border-gray-200">
                                        <div className="flex justify-between items-start">
                                            <div>
                                                <h2 className="text-base font-bold text-gray-900">Order {order.orderNumber}</h2>
                                                <p className="text-xs text-gray-500 mt-0.5">
                                                    Created {new Date(order.createdAt).toLocaleString()}
                                                </p>
                                            </div>
                                            <span className={`px-2 py-0.5 rounded-full text-xs font-medium ${
                                                order.status === 'confirmed' ? 'bg-green-100 text-green-800' :
                                                order.status === 'pending' ? 'bg-yellow-100 text-yellow-800' :
                                                'bg-gray-100 text-gray-800'
                                            }`}>
                                                {order.status}
                                            </span>
                                        </div>
                                    </div>

                                    {/* Flight Info */}
                                    <div className="p-3 border-b border-gray-200">
                                        <h3 className="font-semibold text-gray-900 mb-1.5">Flight Details</h3>
                                        <div className="grid grid-cols-3 gap-2 items-center">
                                            <div>
                                                <div className="text-xl font-bold text-gray-900">{order.flight.origin.airportCode}</div>
                                                <div className="text-xs text-gray-600">{order.flight.origin.city}</div>
                                                <div className="text-xs text-gray-500 mt-0.5">
                                                    {new Date(order.flight.departureTimeLocal).toLocaleString()}
                                                </div>
                                            </div>
                                            <div className="text-center">
                                                <div className="text-xs text-gray-500">→</div>
                                                <div className="text-xs font-medium text-gray-700">{order.flight.flightNumber}</div>
                                                <div className="text-xs text-gray-500">{order.flight.aircraft}</div>
                                            </div>
                                            <div className="text-right">
                                                <div className="text-xl font-bold text-gray-900">{order.flight.destination.airportCode}</div>
                                                <div className="text-xs text-gray-600">{order.flight.destination.city}</div>
                                                <div className="text-xs text-gray-500 mt-0.5">
                                                    {new Date(order.flight.arrivalTimeLocal).toLocaleString()}
                                                </div>
                                            </div>
                                        </div>
                                        <div className="mt-1.5 text-xs text-gray-500">
                                            Operated by {order.flight.operatedBy}
                                        </div>
                                    </div>

                                    {/* Passengers */}
                                    <div className="p-3 border-b border-gray-200">
                                        <h3 className="font-semibold text-gray-900 mb-1.5">
                                            Passengers ({order.passengers.length})
                                        </h3>
                                        <div className="space-y-1">
                                            {order.passengers.map((passenger, idx) => (
                                                <div key={idx} className="flex justify-between items-center py-0.5">
                                                    <div>
                                                        <div className="font-medium text-gray-900">
                                                            {passenger.firstName} {passenger.lastName}
                                                        </div>
                                                        <div className="text-xs text-gray-500">{passenger.email}</div>
                                                    </div>
                                                    <div className="text-xs font-medium text-gray-700">
                                                        Seat {passenger.seatNumber}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Optional Services */}
                                    <div className="p-3 border-b border-gray-200">
                                        <h3 className="font-semibold text-gray-900 mb-1.5">Optional Services</h3>
                                        <div className="grid grid-cols-2 gap-1.5 text-xs">
                                            <div className="flex justify-between">
                                                <span className="text-gray-600">Carry-on Bag</span>
                                                <span className="font-medium">{order.optionalServices.carryOnBag ? 'Yes' : 'No'}</span>
                                            </div>
                                            <div className="flex justify-between">
                                                <span className="text-gray-600">Checked Bags</span>
                                                <span className="font-medium">{order.optionalServices.checkedBags}</span>
                                            </div>
                                            <div className="flex justify-between">
                                                <span className="text-gray-600">Seat Selection</span>
                                                <span className="font-medium capitalize">{order.optionalServices.seatSelection}</span>
                                            </div>
                                            <div className="flex justify-between">
                                                <span className="text-gray-600">Priority Boarding</span>
                                                <span className="font-medium">{order.optionalServices.priorityBoarding ? 'Yes' : 'No'}</span>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Fare Breakdown */}
                                    <div className="p-3">
                                        <h3 className="font-semibold text-gray-900 mb-1.5">Fare Breakdown</h3>
                                        <div className="space-y-0.5 text-xs">
                                            <div className="flex justify-between text-gray-600">
                                                <span>Base Fare</span>
                                                <span>${order.fare.baseFare.toFixed(2)}</span>
                                            </div>
                                            <div className="flex justify-between text-gray-600">
                                                <span>Taxes & Fees</span>
                                                <span>${order.fare.taxesAndFees.toFixed(2)}</span>
                                            </div>
                                            <div className="flex justify-between font-bold text-gray-900 pt-1 mt-1 border-t border-gray-200">
                                                <span>Total</span>
                                                <span>${order.fare.totalFare.toFixed(2)} {order.fare.currency}</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            ReactDOM.render(<App />, document.getElementById('root'));
        </script>
    </body>
    </html>

http:
  method: GET
  url: "{{baseUrl}}/flights/orders?order_number={{orderNumber}}"
  params:
    - name: order_number
      value: "{{orderNumber}}"
      type: query
  auth: inherit

runtime:
  variables:
    - name: orderNumber
      value: 1XGGJFT

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Get Order by Order Number
  
  Retrieves a specific flight order by its 7-character alphanumeric order number.
  
  ## Query Parameters
  
  | Parameter | Type | Description |
  |-----------|------|-------------|
  | `order_number` | string | **Required.** 7-character alphanumeric order number (e.g., 1XGGJFT) |
  
  ## Response
  
  Returns an array containing the matching order (or empty if not found).
  
  ### Order Object
  
  - `orderNumber`: Unique 7-character identifier
  - `status`: Order status (`confirmed`, `pending`, or `cancelled`)
  - `flight`: Flight details (origin, destination, times, flight number, aircraft, operator)
  - `passengers`: Array of passengers with name, email, and seat number
  - `fare`: Pricing breakdown (baseFare, taxesAndFees, totalFare, currency)
  - `optionalServices`: Add-ons (carryOnBag, checkedBags, seatSelection, priorityBoarding)
  - `createdAt` / `updatedAt`: ISO timestamps
  
  ## Example
  
  `GET /flights/orders?order_number=1XGGJFT`
