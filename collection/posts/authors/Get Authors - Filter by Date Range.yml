info:
  name: Get Authors - Filter by Date Range
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/posts/authors?created[gte]=2023-01-01&created[lte]=2023-12-31&page=1&per_page=20"
  params:
    - name: created[gte]
      value: 2023-01-01
      type: query
    - name: created[lte]
      value: 2023-12-31
      type: query
    - name: page
      value: "1"
      type: query
    - name: per_page
      value: "20"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
