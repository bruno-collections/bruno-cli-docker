info:
  name: Get Payments - Combined Filters
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/billing/payments?customer=cus_ABC123&status=succeeded&payment_method=card&created[gte]=2024-01-01&page=1&per_page=20"
  params:
    - name: customer
      value: cus_ABC123
      type: query
    - name: status
      value: succeeded
      type: query
    - name: payment_method
      value: card
      type: query
    - name: created[gte]
      value: 2024-01-01
      type: query
    - name: page
      value: "1"
