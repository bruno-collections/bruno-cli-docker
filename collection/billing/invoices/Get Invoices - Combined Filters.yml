info:
  name: Get Invoices - Combined Filters
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/billing/invoices?customer=cus_ABC123&status=open&due_date[gte]=2024-01-01&page=1&per_page=20"
  params:
    - name: customer
      value: cus_ABC123
      type: query
    - name: status
      value: open
      type: query
    - name: due_date[gte]
      value: 2024-01-01
      type: query
    - name: page
      value: "1"
      type: query
    - name: per_page
      value: "20"
      type: query
  auth: inherit

settings:
