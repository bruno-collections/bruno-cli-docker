info:
  name: Get Invoices - Filter by Status
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/billing/invoices?status=paid"
  params:
    - name: status
      value: paid
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
