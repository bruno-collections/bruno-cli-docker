info:
  name: Get All Orders
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/songs/orders"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  # Get All Orders
  
  Retrieves all song orders with default pagination.
  
  ## Query Parameters
  
  | Parameter | Type | Description |
  |-----------|------|-------------|
  | `page` | integer | Page number (default: 1) |
  | `per_page` | integer | Items per page (default: 10, max: 50) |
  
  ## Response
  
  Returns an array of order objects. The `x-total-count` header contains total orders.
  
  ### Order Object Structure
  
  ```json
  {
    "orderNumber": "A3B7C9D",
    "status": "confirmed",
    "song": {
      "title": "Love Heart",
      "artist": "Taylor Swift",
      "album": "Midnight Dreams",
      "genre": "Pop",
      "duration": "3:45",
      "releaseDate": "2023-05-15",
      "format": "Digital"
    },
    "purchase": {
      "type": "song",
      "quantity": 1,
      "format": "Digital"
    },
    "customer": {
      "firstName": "John",
      "lastName": "Smith",
      "email": "john.smith@example.com"
    },
    "pricing": {
      "unitPrice": 1.29,
      "quantity": 1,
      "subtotal": 1.29,
      "tax": 0.10,
      "total": 1.39,
      "currency": "USD"
    },
    "createdAt": "2023-05-20T14:30:00.000Z",
    "updatedAt": "2023-05-20T14:30:00.000Z"
  }
  ```
  
  ### Order Statuses
  
  - `confirmed` - Order is confirmed
  - `pending` - Order is pending
  - `cancelled` - Order has been cancelled
  
  ### Purchase Types
  
  - `song` - Single song purchase (70% of orders)
  - `album` - Album purchase (30% of orders)
  
  ## Example
  
  `GET /songs/orders`
