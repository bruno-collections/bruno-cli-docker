http:
  method: GET
  url: "{{baseUrl}}/songs?min_rating=4.0&max_price=1.50"
  params:
    - name: min_rating
      value: "4.0"
      type: query
    - name: max_price
      value: "1.50"
      type: query
  auth: inherit

settings:
  encodeUrl: true
